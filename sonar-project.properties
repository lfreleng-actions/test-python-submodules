sonar.organization=lfreleng-actions
# SonarCloud names a project it creates from a GitHub repository
# <organization>_<repository>, so this is the key such a project gets.
# test-python-project's properties file still names the unprefixed
# key, which SonarCloud does not know; its real project is
# lfreleng-actions_test-python-project.
sonar.projectKey=lfreleng-actions_test-python-submodules
# Deliberately no sonar.sources: the default, the project base
# directory, is what reaches into the submodules. Narrowing it would
# stop the fixture testing what callers actually get.
